name: Build, Publish and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE_NAMESPACE: ghcr.io/bansodevivek/ec2-kg

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/backend:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/backend:main

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/frontend:main

  deploy:
    name: Deploy GHCR images
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy exact image version to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            cd /home/ubuntu/ec2-KG

            export APP_VERSION="${{ github.sha }}"

            echo "=== Deployment version ==="
            echo "$APP_VERSION"

            echo "=== Running GHCR deployment ==="
            ./deploy/deploy.sh

            echo "=== Container status ==="
            docker compose ps

            echo "=== HTTP health check ==="
            curl -fsS http://localhost/ > /dev/null

            echo "=== GHCR deployment successful ==="
